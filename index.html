<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер чтения английских слов</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --vowel-color: #e74c3c;
            --consonant-color: #3498db;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.08);
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* Кнопки меню */
        .letters-group {
            margin-bottom: 30px;
        }

        .group-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .letter-btn {
            font-family: inherit;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            min-width: 90px;
        }

        .letter-btn.vowel {
            border: 3px solid var(--vowel-color);
            color: var(--vowel-color);
        }

        .letter-btn.vowel:hover {
            background-color: var(--vowel-color);
            color: white;
        }

        .letter-btn.consonant {
            border: 3px solid var(--consonant-color);
            color: var(--consonant-color);
        }

        .letter-btn.consonant:hover {
            background-color: var(--consonant-color);
            color: white;
        }

        /* Экраны игры */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Карточка с памяткой */
        .memo-card {
            background: #fdfefe;
            border: 2px dashed #bdc3c7;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            font-size: 20px;
        }

        .action-btn {
            font-family: inherit;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: #27ae60;
        }

        .secondary-btn {
            font-family: inherit;
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Элементы уровней */
        .word-display {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 40px 0;
            color: #2c3e50;
        }

        .audio-btn {
            background: #f39c12;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .audio-btn svg {
            fill: white;
            width: 32px;
            height: 32px;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 20px auto;
            max-width: 300px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s;
        }

        /* Стили уровня 3 */
        .syllable-choice {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .choice-btn {
            font-family: inherit;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            max-width: 240px;
        }

        .choice-btn.selected {
            border-color: #34495e;
            background-color: #ebf5fb;
        }

        .choice-btn.correct {
            border-color: var(--correct-color);
            background-color: rgba(46, 204, 113, 0.1);
            color: #27ae60;
        }

        .choice-btn.wrong {
            border-color: var(--wrong-color);
            background-color: rgba(231, 76, 60, 0.1);
            color: #c0392b;
        }

        .feedback-msg {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 27px;
        }

        /* Информационная плашка */
        .level-title {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen" class="screen active">
        <h1>Давай учиться читать! Выбери букву!</h1>
        
        <div class="letters-group">
            <div class="group-title">Гласные буквы</div>
            <div class="btn-grid" id="vowels-grid"></div>
        </div>

        <div class="letters-group">
            <div class="group-title">Согласные сочетания</div>
            <div class="btn-grid" id="consonants-grid"></div>
        </div>
    </div>

    <!-- ЭКРАН ПАМЯТКИ -->
    <div id="memo-screen" class="screen">
        <h2 id="memo-title">Памятка</h2>
        <div class="memo-card" id="memo-text">
            Тут будет правило...
        </div>
        <button class="action-btn" onclick="startLevel(1)">Начать</button>
        <div>
            <button class="secondary-btn" onclick="showMenu()">Назад в меню</button>
        </div>
    </div>

    <!-- ЭКРАН ИГРЫ (Уровни 1 и 2) -->
    <div id="play-screen" class="screen">
        <div class="level-title" id="play-level-title">Уровень 1</div>
        <div class="progress-bar"><div class="progress-fill" id="play-progress"></div></div>
        <div class="word-display" id="play-word">word</div>
        
        <div>
            <button class="audio-btn" onclick="playCurrentWord()" title="Прослушать">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </div>

        <div>
            <button class="action-btn" id="next-btn" onclick="nextWord()">Дальше</button>
        </div>
        <div>
            <button class="secondary-btn" onclick="showMenu()">В меню</button>
        </div>
    </div>

    <!-- ЭКРАН УРОВНЯ 3 (Классификация слогов) -->
    <div id="level3-screen" class="screen">
        <div class="level-title">Уровень 3: Определи тип слога</div>
        <div class="progress-bar"><div class="progress-fill" id="level3-progress"></div></div>
        <div class="word-display" id="level3-word">word</div>

        <div class="syllable-choice">
            <button class="choice-btn" id="choice-open" onclick="selectSyllable('open')">Открытая</button>
            <button class="choice-btn" id="choice-closed" onclick="selectSyllable('closed')">Закрытая</button>
        </div>

        <div class="feedback-msg" id="feedback-text"></div>

        <div style="margin-bottom: 20px;">
            <button class="action-btn" id="check-btn" onclick="checkAnswer()" style="background-color: #34495e; box-shadow: none;">Проверить</button>
            <button class="action-btn" id="l3-next-btn" onclick="nextL3Word()" style="display: none;">Дальше →</button>
        </div>
        <div>
            <button class="secondary-btn" onclick="showMenu()">В меню</button>
        </div>
    </div>

    <!-- ЭКРАН ЗАВЕРШЕНИЯ -->
    <div id="complete-screen" class="screen">
        <h2>Молодец! Ты отлично справился! 🎉</h2>
        <p>Ты прочитал все слова и выполнил задания!</p>
        <button class="action-btn" onclick="showMenu()">Выбрать другую букву</button>
    </div>
</div>

<script>
    const lettersData = {
        'Aa': {
            memo: "Это буква Aa (эй). Она — гласная.<br><br>" +
                  "Когда её <strong>открыли</strong> (или рядом есть вторая гласная-подружка, как в словах s<strong>ai</strong>l, m<strong>ai</strong>l), она громко говорит своё имя: <strong>«эй»</strong>.<br>" +
                  "Когда её <strong>закрыли</strong> согласной буквой на конце, она обижается и говорит коротко: <strong>«э»</strong>.",
            level1: ["cat", "bat", "fat", "hat", "mat", "rat", "sat", "bag", "tag", "rag", "map", "cap", "tap", "dad", "sad"],
            level2: ["cake", "lake", "make", "game", "gate", "sail", "mail", "rain", "tail", "main", "pain", "wait", "day", "may", "play"],
            level3: [
                { word: "cat", type: "closed" },
                { word: "cake", type: "open" },
                { word: "map", type: "closed" },
                { word: "sail", type: "open" }, 
                { word: "dad", type: "closed" },
                { word: "mail", type: "open" }, 
                { word: "hat", type: "closed" },
                { word: "rain", type: "open" },
                { word: "bag", type: "closed" },
                { word: "play", type: "open" }
            ]
        },
        'Ee': {
            memo: "Это буква Ee (и). Она — гласная.<br><br>В <strong>открытом</strong> слоге (или когда две гласные стоят рядом, например, ee) она читается длинно: <strong>«и»</strong>.<br>В <strong>закрытом</strong> слоге она говорит коротко: <strong>«э»</strong>.",
            level1: ["bed", "red", "wet", "net", "pen", "hen", "ten", "leg", "peg", "men"],
            level2: ["he", "she", "we", "me", "bee", "tree", "feet", "meet", "seed", "deep"],
            level3: [
                { word: "bed", type: "closed" },
                { word: "me", type: "open" },
                { word: "red", type: "closed" },
                { word: "bee", type: "open" },
                { word: "pen", type: "closed" },
                { word: "we", type: "open" }
            ]
        },
        'Ii': {
            memo: "Это буква Ii (ай). Она — гласная.<br><br>В <strong>открытом</strong> слоге она читается как в алфавите: <strong>«ай»</strong>.<br>В <strong>закрытом</strong> слоге она превращается в короткий звук <strong>«и»</strong>.",
            level1: ["pin", "bin", "tin", "win", "pig", "big", "dig", "fit", "sit", "hit"],
            level2: ["bite", "kite", "five", "nine", "line", "pine", "fine", "ride", "wide", "time"],
            level3: [
                { word: "pin", type: "closed" },
                { word: "kite", type: "open" },
                { word: "big", type: "closed" },
                { word: "five", type: "open" },
                { word: "sit", type: "closed" },
                { word: "nine", type: "open" }
            ]
        },
        'Oo': {
            memo: "Это буква Oo (оу). Она — гласная.<br><br>В <strong>открытом</strong> слоге она гордо говорит <strong>«оу»</strong>.<br>В <strong>закрытом</strong> слоге она звучит коротко: <strong>«о»</strong>.",
            level1: ["dog", "log", "fog", "hot", "pot", "not", "box", "fox", "hop", "mop"],
            level2: ["rose", "nose", "hose", "home", "bone", "hope", "rope", "note", "vote", "sole"],
            level3: [
                { word: "dog", type: "closed" },
                { word: "nose", type: "open" },
                { word: "hot", type: "closed" },
                { word: "home", type: "open" },
                { word: "box", type: "closed" },
                { word: "rope", type: "open" }
            ]
        },
        'Uu': {
            memo: "Это буква Uu (ю). Она — гласная.<br><br>В <strong>открытом</strong> слоге она читается как <strong>«ю»</strong> или длинное <strong>«у»</strong>.<br>В <strong>закрытом</strong> слоге она превращается в короткий звук <strong>«а»</strong>.",
            level1: ["cup", "pup", "bus", "run", "sun", "gun", "nut", "hut", "cut", "tub"],
            level2: ["tube", "cube", "mute", "cute", "lute", "use", "dune", "tune", "rule", "june"],
            level3: [
                { word: "cup", type: "closed" },
                { word: "cube", type: "open" },
                { word: "sun", type: "closed" },
                { word: "cute", type: "open" },
                { word: "bus", type: "closed" },
                { word: "tune", type: "open" }
            ]
        },
        'Yy': {
            memo: "Это буква Yy (уай). Она особенная гласная.<br><br>В конце коротких слов под ударением читается как <strong>«ай»</strong>.<br>В закрытом слоге или в конце длинных слов без ударения читается как <strong>«и»</strong>.",
            level1: ["gym", "myth", "lynx", "cyst"],
            level2: ["my", "by", "fly", "cry", "dry", "try", "sky", "fry", "spy", "shy"],
            level3: [
                { word: "gym", type: "closed" },
                { word: "my", type: "open" },
                { word: "fly", type: "open" },
                { word: "myth", type: "closed" }
            ]
        },
        'sh': {
            memo: "Буквы <strong>S</strong> и <strong>H</strong> подружились и стали звучать вместе как один мягкий звук <strong>«ш»</strong>.",
            level1: ["ship", "shop", "fish", "dish", "wish", "bash", "cash", "rush", "shut", "shed"],
            level2: ["shake", "shame", "shape", "shine", "shore", "share", "sheet", "sheep", "shoot", "shout"],
            level3: [
                { word: "ship", type: "closed" },
                { word: "shake", type: "open" },
                { word: "fish", type: "closed" },
                { word: "shine", type: "open" }
            ]
        },
        'ch': {
            memo: "Буквы <strong>C</strong> и <strong>H</strong> объединились и вместе поют веселую песенку: <strong>«ч»</strong>.",
            level1: ["chin", "chip", "chick", "rich", "much", "such", "chop", "chat", "chess"],
            level2: ["chime", "chase", "chain", "chair", "cheese", "cheat", "chart", "charm"],
            level3: [
                { word: "chip", type: "closed" },
                { word: "chime", type: "open" },
                { word: "rich", type: "closed" },
                { word: "chase", type: "open" }
            ]
        },
        'th': {
            memo: "Буквы <strong>T</strong> и <strong>H</strong> — самые капризные. Они высовывают кончик язычка между зубами и говорят либо звонко <strong>«з»</strong>, либо глухо <strong>«с»</strong>.",
            level1: ["this", "that", "them", "then", "thin", "with", "path", "bath", "moth"],
            level2: ["these", "those", "theme", "thief", "three", "teeth", "mouth", "south"],
            level3: [
                { word: "this", type: "closed" },
                { word: "these", type: "open" },
                { word: "thin", type: "closed" },
                { word: "those", type: "open" }
            ]
        }
    };

    const vowels = ['Aa', 'Ee', 'Ii', 'Oo', 'Uu', 'Yy'];
    const consonants = ['sh', 'ch', 'th'];

    let currentLetter = '';
    let currentLevel = 1;
    let wordIndex = 0;
    let selectedSyllableType = null;

    function initMenu() {
        const vowelsGrid = document.getElementById('vowels-grid');
        const consonantsGrid = document.getElementById('consonants-grid');

        vowelsGrid.innerHTML = '';
        consonantsGrid.innerHTML = '';

        vowels.forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn vowel';
            btn.innerText = v;
            btn.onclick = () => selectLetter(v);
            vowelsGrid.appendChild(btn);
        });

        consonants.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn consonant';
            btn.innerText = c;
            btn.onclick = () => selectLetter(c);
            consonantsGrid.appendChild(btn);
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function selectLetter(letter) {
        currentLetter = letter;
        const data = lettersData[letter];
        
        document.getElementById('memo-title').innerText = `Буква / сочетание: ${letter}`;
        document.getElementById('memo-text').innerHTML = data.memo;
        
        showScreen('memo-screen');
    }

    function showMenu() {
        showScreen('menu-screen');
    }

    function startLevel(level) {
        currentLevel = level;
        wordIndex = 0;

        if (level === 1) {
            document.getElementById('play-level-title').innerText = "Уровень 1: Закрытый слог / Простые сочетания";
            showPlayWord();
            showScreen('play-screen');
        } else if (level === 2) {
            document.getElementById('play-level-title').innerText = "Уровень 2: Открытый слог и гласные-подружки";
            showPlayWord();
            showScreen('play-screen');
        } else if (level === 3) {
            showL3Word();
            showScreen('level3-screen');
        }
    }

    function showPlayWord() {
        const data = lettersData[currentLetter];
        const wordList = currentLevel === 1 ? data.level1 : data.level2;
        
        if (wordIndex >= wordList.length) {
            if (currentLevel === 1) {
                startLevel(2);
            } else {
                startLevel(3);
            }
            return;
        }

        const word = wordList[wordIndex];
        document.getElementById('play-word').innerText = word;
        
        const progressPercent = (wordIndex / wordList.length) * 100;
        document.getElementById('play-progress').style.width = `${progressPercent}%`;

        speakWord(word);
    }

    function nextWord() {
        wordIndex++;
        showPlayWord();
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.75;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playCurrentWord() {
        const word = document.getElementById('play-word').innerText;
        speakWord(word);
    }

    function showL3Word() {
        const data = lettersData[currentLetter];
        const wordList = data.level3;

        if (wordIndex >= wordList.length) {
            showScreen('complete-screen');
            return;
        }

        const currentItem = wordList[wordIndex];
        document.getElementById('level3-word').innerText = currentItem.word;
        
        document.getElementById('choice-open').className = 'choice-btn';
        document.getElementById('choice-closed').className = 'choice-btn';
        selectedSyllableType = null;

        document.getElementById('feedback-text').innerText = '';
        document.getElementById('feedback-text').style.color = 'inherit';
        document.getElementById('check-btn').style.display = 'inline-block';
        document.getElementById('l3-next-btn').style.display = 'none';

        const progressPercent = (wordIndex / wordList.length) * 100;
        document.getElementById('level3-progress').style.width = `${progressPercent}%`;
    }

    function selectSyllable(type) {
        if (document.getElementById('l3-next-btn').style.display === 'inline-block') return;

        selectedSyllableType = type;
        
        document.getElementById('choice-open').className = 'choice-btn';
        document.getElementById('choice-closed').className = 'choice-btn';

        if (type === 'open') {
            document.getElementById('choice-open').classList.add('selected');
        } else {
            document.getElementById('choice-closed').classList.add('selected');
        }
    }

    function checkAnswer() {
        if (!selectedSyllableType) {
            document.getElementById('feedback-text').innerText = "Пожалуйста, выбери тип слога!";
            document.getElementById('feedback-text').style.color = '#e67e22';
            return;
        }

        const data = lettersData[currentLetter];
        const currentItem = data.level3[wordIndex];
        const correctType = currentItem.type;

        const openBtn = document.getElementById('choice-open');
        const closedBtn = document.getElementById('choice-closed');
        const feedback = document.getElementById('feedback-text');

        if (correctType === 'open') {
            openBtn.classList.add('correct');
            if (selectedSyllableType === 'closed') closedBtn.classList.add('wrong');
        } else {
            closedBtn.classList.add('correct');
            if (selectedSyllableType === 'open') openBtn.classList.add('wrong');
        }

        if (selectedSyllableType === correctType) {
            feedback.innerText = "Правильно! Слушаем и повторяем.";
            feedback.style.color = '#27ae60';
        } else {
            feedback.innerText = "Ошибочка вышла. Послушай правильное чтение.";
            feedback.style.color = '#c0392b';
        }

        speakWord(currentItem.word);

        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('l3-next-btn').style.display = 'inline-block';
    }

    function nextL3Word() {
        wordIndex++;
        showL3Word();
    }

    initMenu();
</script>

</body>
</html>
